# git-cliff config for release notes. Commits follow conventional commits:
#   <type>(<scope>): <icon> <short description>   (see CLAUDE.md)
[changelog]
header = """
# Changelog\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}

{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{{ commit.message | split(pat="\n") | first }}
{% endfor %}
{% endfor %}\
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
commit_preprocessors = [
  # Non-conventional messages ("Add ...", "Fix ...") become feat:/fix:.
  { pattern = "^Merge ", replace = "chore: Merge " },
  { pattern = "^(Fix\\b)", replace = "fix: ${1}" },
  { pattern = "^([A-Z][\\w'-]*) ", replace = "feat: ${1} " },
  # Drop the emoji after "type(scope): " in the notes.
  { pattern = "(\\w+(?:\\([^)]*\\))?!?:\\s+)[^\\w\\s]+\\s*", replace = "$1" },
]
commit_parsers = [
  { message = "^Merge ", skip = true },
  { message = "^feat",     group = "✨ Features" },
  { message = "^fix",      group = "🐛 Fixes" },
  { message = "^perf",     group = "⚡ Performance" },
  { message = "^refactor", group = "♻️ Refactoring" },
  { message = "^docs",     group = "📝 Documentation" },
  { message = "^ci",       group = "👷 CI/CD" },
  { message = "^build",    group = "🏗️ Build" },
  { message = "^chore",    skip = true },
  { message = "^style",    skip = true },
  { message = "^test",     skip = true },
  { message = "^wip",      skip = true },
  { message = ".*",        group = "✨ Features" },
]
filter_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
